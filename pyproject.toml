[project]
name = "che1147-battery-cycle-life"
version = "1.0.0"
description = "CHE1147 Group 11: early prediction of lithium-ion battery cycle life from the first 100 cycles"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Shuoyuan Amaris Gao" },
    { name = "Christina Yixuan Cheng" },
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "jupyter>=1.0",
]

# The code lives in a notebook, not an installable package.
# Install the dependencies with:  pip install -r requirements.txt
[tool.setuptools]
py-modules = []
